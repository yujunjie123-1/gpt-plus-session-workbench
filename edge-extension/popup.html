<html lang="zh-CN"><head><meta charset="utf-8"><title>本机 Session 助手</title><link rel="stylesheet" href="popup.css"></head>
<body><div class="tag">EDGE · 自动登录</div><h1>Session 助手</h1><p>自动填写 GPT 账号、密码和验证码，登录后自动获取 Session。</p><div id="status" role="status">正在检查连接…</div><p id="private-note" hidden>请在扩展的“详细信息”中勾选“允许在 InPrivate 中使用”。</p><button id="connect">重新连接当前工作台</button><button id="scan" class="secondary">立即检查并继续</button><button id="disconnect" class="text">断开本机连接</button><small>工作台打开后会自动连接。<br>人机或安全验证需要在 Edge 中完成。<br>扩展不会保存 Session 到磁盘。</small><script src="popup.js"></script></body></html>
