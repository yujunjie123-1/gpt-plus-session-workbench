<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机连接设置</title><link rel="stylesheet" href="/mobile/mobile.css"><script defer src="/mobile/setup.js"></script></head><body><main><span class="mark">G+</span><h1>手机连接设置</h1><p>手机保持 Tailscale 已连接，浏览器打开以下地址：</p><a id="address" target="_blank" rel="noreferrer"></a><button id="copy" type="button">复制手机地址</button><p id="backend"></p><button id="generate" type="button">生成 10 分钟配对码</button><output id="code"></output><p id="message" role="status"></p><p class="note">配对码只能使用一次。配对成功后手机授权保留 30 天；无需开放公网端口。</p><button id="revoke" class="secondary" type="button">退出全部手机</button></main></body></html>
