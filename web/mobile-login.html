<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接充值工作台</title><link rel="stylesheet" href="/mobile/mobile.css"><script defer src="/mobile/login.js"></script></head><body><main><span class="mark">G+</span><h1>连接电脑上的工作台</h1><p>保持手机 Tailscale 已连接，输入电脑“手机连接设置”中显示的 8 位配对码。</p><form><label for="code">配对码</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required autofocus><button type="submit">连接工作台</button></form><p id="message" role="status"></p><p class="note">充值任务继续在电脑运行。电脑需保持开机、联网并运行工作台。</p></main></body></html>
